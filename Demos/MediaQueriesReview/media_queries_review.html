<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Queries</title>
    <style>
      /* Mobile First Design */
      body {
        background-color: #654b38;
      }
      h1,
      h2 {
        color: #fafbfa;
        text-align: center;
      }
      /* Tablet and Desktop Design */
      @media screen and (min-width: 700px) {
        body {
          background-color: #6b5b51;
        }
        h1,
        h2 {
          color: #eeecda;
        }
      }

      @media screen and (min-width: 960px) {
        body {
          background-color: #5a4c43;
        }
        h1,
        h2 {
          color: #e7e4d9;
        }
      }

      @media screen and (min-width: 1280px) {
        body {
          background-color: #4b3832;
        }
        h1,
        h2 {
          color: #e0d8c3;
        }
      }
    </style>
  </head>
  <body>
    <h1>Media Queries</h1>
    <h2>Anthony X Virjin</h2>
  </body>
</html>
